<svg viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A quiet night scene with a rising moon over still water, closing the profile." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="fSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B0618"/>
      <stop offset="55%" stop-color="#221238"/>
      <stop offset="100%" stop-color="#4A2E6B"/>
    </linearGradient>
    <radialGradient id="fMoonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF6E5" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#FFE3D6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFE3D6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A2E6B" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0B0618" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="fBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect width="1200" height="280" fill="url(#fSky)"/>
  <g>
    <circle cx="1000" cy="90" r="16" fill="#FFF6E5"/>
    <circle cx="1000" cy="90" r="70" fill="url(#fMoonGlow)" filter="url(#fBlur)"/>
  </g>
  <g fill="#FFF6E5" opacity="0.8">
    <circle cx="120" cy="40" r="1.2"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="70" r="1" ><animate attributeName="opacity" values="0.9;0.2;0.9" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="30" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="55" r="1"><animate attributeName="opacity" values="0.8;0.3;0.8" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="25" r="1.2"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
  </g>
  <path d="M0,210 L200,190 L400,205 L620,185 L820,200 L1020,180 L1200,200 L1200,280 L0,280 Z" fill="#150A2A" opacity="0.9"/>
  <rect x="0" y="215" width="1200" height="65" fill="url(#fWater)"/>
  <g stroke="#FFE3D6" stroke-opacity="0.15" stroke-width="1.2">
    <line x1="850" y1="235" x2="1150" y2="235"/>
    <line x1="900" y1="255" x2="1120" y2="255"/>
  </g>
  <g transform="translate(230,205)">
    <path d="M-8,-40 C -20,-28 -18,4 -12,32 C -5,16 4,16 11,32 C 16,4 18,-28 6,-40 Z" fill="#0B0618"/>
    <rect x="-6" y="-42" width="12" height="20" rx="5" fill="#0B0618"/>
    <circle cx="0" cy="-52" r="8" fill="#0B0618"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <text x="600" y="150" font-size="22" fill="#FFE3D6" opacity="0.9" letter-spacing="2">Thanks for reading this far into the story.</text>
    <text x="600" y="178" font-size="13" fill="#C9B8DA" letter-spacing="3">— TO BE CONTINUED —</text>
  </g>
</svg>
