<svg width="100%" height="100" viewBox="0 0 1200 100"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Red → Orange → Gold Aura -->
    <linearGradient id="aura" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7F1600" stop-opacity="0"/>
      <stop offset="15%"  stop-color="#B92700"/>
      <stop offset="30%"  stop-color="#F04400"/>
      <stop offset="50%"  stop-color="#FFB347"/>
      <stop offset="70%"  stop-color="#F04400"/>
      <stop offset="85%"  stop-color="#B92700"/>
      <stop offset="100%" stop-color="#7F1600" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft aura -->
    <filter id="blur">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <!-- Sharp glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- ================================================= -->
  <!-- WIDE SOFT AURA WAVES -->
  <!-- ================================================= -->

  <g
    fill="none"
    stroke="url(#aura)"
    stroke-linecap="round"
    filter="url(#blur)"
    opacity="0.55">

    <!-- Wave 1 -->
    <path
      d="M20 52
         C110 25 170 78 260 50
         S410 25 500 50
         S590 72 600 50
         S610 28 700 50
         S850 75 940 50
         S1090 25 1180 52"
      stroke-width="14"/>

    <!-- Wave 2 -->
    <path
      d="M20 57
         C120 85 180 30 280 56
         S420 82 510 55
         S570 35 600 55
         S630 75 690 55
         S830 28 920 56
         S1080 82 1180 55"
      stroke-width="9"/>

  </g>


  <!-- ================================================= -->
  <!-- MAIN FLOWING AURA -->
  <!-- ================================================= -->

  <g
    fill="none"
    stroke="url(#aura)"
    stroke-linecap="round"
    filter="url(#glow)">

    <!-- Main Wave -->
    <path
      d="M25 53
         C100 35 145 70 215 52
         C285 34 330 70 400 52
         C465 35 520 68 555 54
         C575 46 590 39 600 52
         C610 65 625 58 645 52
         C680 39 735 70 800 52
         C870 34 915 70 985 52
         C1055 34 1100 70 1175 53"
      stroke-width="3"/>


    <!-- Upper flowing wave -->
    <path
      d="M35 44
         C110 20 155 62 225 43
         C295 24 345 60 415 42
         C470 28 520 52 565 43
         C585 39 595 33 600 42
         C605 51 615 47 635 43
         C680 32 730 59 785 42
         C855 22 905 61 975 43
         C1045 25 1090 63 1165 44"
      stroke-width="1.4"
      opacity="0.8"/>


    <!-- Lower flowing wave -->
    <path
      d="M35 63
         C105 84 155 45 225 63
         C295 82 345 46 415 64
         C470 78 520 55 565 63
         C585 67 595 73 600 64
         C605 55 615 60 635 63
         C680 74 730 47 785 64
         C855 83 905 45 975 63
         C1045 81 1090 43 1165 63"
      stroke-width="1.2"
      opacity="0.7"/>

  </g>


  <!-- ================================================= -->
  <!-- ENERGY STREAMS -->
  <!-- ================================================= -->

  <g
    fill="none"
    stroke="#FF8A32"
    stroke-linecap="round"
    opacity="0.8">

    <path
      d="M80 52
         C145 40 175 65 230 52
         S320 39 365 52"
      stroke-width="1"/>

    <path
      d="M835 52
         C890 39 925 65 980 52
         S1070 40 1125 52"
      stroke-width="1"/>

  </g>


  <!-- ================================================= -->
  <!-- SMALL AURA PARTICLES -->
  <!-- ================================================= -->

  <g fill="#FF9A3D" filter="url(#glow)">

    <circle cx="150" cy="39" r="1.2"/>
    <circle cx="205" cy="67" r="0.9"/>
    <circle cx="285" cy="37" r="1.1"/>
    <circle cx="350" cy="65" r="0.8"/>
    <circle cx="440" cy="40" r="1"/>

    <circle cx="760" cy="40" r="1"/>
    <circle cx="850" cy="66" r="0.8"/>
    <circle cx="915" cy="37" r="1.1"/>
    <circle cx="1000" cy="67" r="0.9"/>
    <circle cx="1080" cy="40" r="1.2"/>

  </g>

</svg>
